name: Rohner Dispo veröffentlichen

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Projekt laden
        uses: actions/checkout@v4

      - name: Node.js einrichten
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Pakete installieren
        run: npm ci

      - name: App prüfen
        run: npm run typecheck && npm test

      - name: Webversion erstellen
        run: npx expo export --platform web --clear
        env:
          EXPO_NO_TELEMETRY: 1
          EXPO_PUBLIC_SUPABASE_URL: https://fukxlbqahzfccmrtjugx.supabase.co
          EXPO_PUBLIC_SUPABASE_PUBLISHABLE_KEY: sb_publishable_HEtBz501jUDZXbZoF-MoAw_tm8ZzKRQ

      - name: GitHub Pages einrichten
        uses: actions/configure-pages@v5

      - name: Webversion hochladen
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

      - name: Webversion veröffentlichen
        id: deployment
        uses: actions/deploy-pages@v4
